version: 2
updates:
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 1
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
  - package-ecosystem: "docker"
    open-pull-requests-limit: 1
    directory: "/simplex-smp-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
  - package-ecosystem: "docker"
    open-pull-requests-limit: 1
    directory: "/simplex-xftp-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
