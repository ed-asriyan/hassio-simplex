# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: SimpleX XFTP Server
version: "7.0.1"
slug: simplex-xftp-server
description: End-to-end encrypted file relay for SimpleX Chat
url: "https://github.com/ed-asriyan/hassio-simplex/tree/master/simplex-xftp-server"
arch:
  - aarch64
  - amd64
init: false
map:
  - type: data
    read_only: false
  - type: ssl
ports:
  443/tcp: null
ports_description:
  443/tcp: XFTP server — must be the same value as the 'port' option
options:
  addr: ""
  port: 443
  quota: "10gb"
  expire_files_hours: 48
  new_files: true
  ssl:
    enabled: false
    certfile: fullchain.pem
    keyfile: privkey.pem
  information: {}
schema:
  addr: str
  port: int
  quota: str
  pass: str?
  expire_files_hours: int
  new_files: bool
  ssl:
    enabled: bool
    certfile: str
    keyfile: str
  information:
    server_country: match(^[A-Z]{2}$)?
    operator: str?
    operator_country: match(^[A-Z]{2}$)?
    website: url?
    admin_email: email?
    complaints_email: email?
    hosting: str?
    hosting_country: match(^[A-Z]{2}$)?
    hosting_type: list(virtual|dedicated|colocation|owned)?
image: "ghcr.io/ed-asriyan/hassio-simplex-xftp-server"
