configuration:
  information:
    name: Server information
    description: >-
      Optional public information about who operates the server, written to
      the [INFORMATION] section of the server configuration. All fields are
      optional.
    fields:
      server_country:
        name: Server country
        description: Country where the server is located, as an ISO 3166 2-letter code, e.g. DE.
      operator:
        name: Operator
        description: Name of the organization or person operating the server.
      operator_country:
        name: Operator country
        description: Country of the operator, as an ISO 3166 2-letter code, e.g. DE.
      website:
        name: Website
        description: Website of the operator, e.g. https://example.com.
      admin_email:
        name: Admin email
        description: Email for administrative contacts.
      complaints_email:
        name: Complaints email
        description: Email for complaints and feedback.
      hosting:
        name: Hosting provider
        description: Name of the hosting provider, e.g. your own name when self-hosting at home.
      hosting_country:
        name: Hosting country
        description: Country of the hosting provider, as an ISO 3166 2-letter code, e.g. DE.
      hosting_type:
        name: Hosting type
        description: >-
          virtual (VPS), dedicated (rented physical server), colocation (own
          server in a data center) or owned (own server at own premises, e.g.
          Home Assistant at home).
